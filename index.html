<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>學跡老師操作地圖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* 版面：上面是一整條「一堂課的時間」流程圖（五段、每段幾個節點），下面是點到的那一步：左邊怎麼做、右邊假資料畫面。
   顏色沿用學跡平台的代幣（藍紫色系品牌色、功能色、琥珀＝提醒）。 */
:root {
  --bg: #F4F6FA;
  --surface: #FFFFFF;
  --surface-2: #F8FAFC;
  --muted-bg: #EEF1F6;
  --text: #0F172A;
  --text-2: #475569;
  --text-3: #5B6474;
  --border: #E2E8F0;
  --border-strong: #8A93A6;
  --brand: #4E4F6E;
  --brand-deep: #33344A;
  --brand-soft: #EDF2F7;
  --brand-sky: #93B5CF;
  --on-brand: #FFFFFF;
  --s-ready: #1259C2;
  --s-prep: #6941C6;
  --s-live: #0D6B63;
  --s-after: #A64007;
  --s-other: #344054;
  --ok: #026E41; --ok-soft: #ECFDF3;
  --warn: #A64007; --warn-soft: #FFF6E5;
  --bad: #B42318; --bad-soft: #FEF3F2;
  --ai: #6941C6; --ai-soft: #F4F0FD;
  --g1: #0E7490; --g2: #B54708; --g3: #3F7A2E; --g4: #6941C6; --g5: #1259C2; --g6: #9E2A6F;
  --full-bg: #10121C; --full-fg: #F2F3F8;
  --shadow: 0 1px 2px rgba(15,23,42,.06), 0 6px 20px rgba(15,23,42,.06);
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-head: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12131B; --surface: #1B1D29; --surface-2: #222534; --muted-bg: #2A2D3E;
    --text: #E8EAF2; --text-2: #B8BDCC; --text-3: #A3A9BA; --border: #33374A; --border-strong: #6B7288;
    --brand: #A9AAD6; --brand-deep: #C9CAEA; --brand-soft: #2A2C42; --brand-sky: #6F93AF; --on-brand: #15162A;
    --s-ready: #7FB0FF; --s-prep: #B9A2F2; --s-live: #5CC7B9; --s-after: #F2A066; --s-other: #AEB8CC;
    --ok: #5CD69B; --ok-soft: #173326; --warn: #F2A066; --warn-soft: #3A2716; --bad: #FF8A80; --bad-soft: #3C1D1B;
    --ai: #B9A2F2; --ai-soft: #2C2442;
    --g1: #4FC3DB; --g2: #F2A066; --g3: #8BCB72; --g4: #B9A2F2; --g5: #7FB0FF; --g6: #F08FC8;
    --full-bg: #07080D; --full-fg: #F2F3F8;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12131B; --surface: #1B1D29; --surface-2: #222534; --muted-bg: #2A2D3E;
  --text: #E8EAF2; --text-2: #B8BDCC; --text-3: #A3A9BA; --border: #33374A; --border-strong: #6B7288;
  --brand: #A9AAD6; --brand-deep: #C9CAEA; --brand-soft: #2A2C42; --brand-sky: #6F93AF; --on-brand: #15162A;
  --s-ready: #7FB0FF; --s-prep: #B9A2F2; --s-live: #5CC7B9; --s-after: #F2A066; --s-other: #AEB8CC;
  --ok: #5CD69B; --ok-soft: #173326; --warn: #F2A066; --warn-soft: #3A2716; --bad: #FF8A80; --bad-soft: #3C1D1B;
  --ai: #B9A2F2; --ai-soft: #2C2442;
  --g1: #4FC3DB; --g2: #F2A066; --g3: #8BCB72; --g4: #B9A2F2; --g5: #7FB0FF; --g6: #F08FC8;
  --full-bg: #07080D; --full-fg: #F2F3F8;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 15px; line-height: 1.65; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 24px; }
h1, h2, h3 { font-family: var(--font-head); text-wrap: balance; margin: 0; letter-spacing: .01em; }
h1 { font-size: clamp(26px, 3.4vw, 36px); color: var(--brand-deep); }
h2 { font-size: 22px; }
h3 { font-size: 16px; font-family: var(--font-body); font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brand-sky); outline-offset: 2px; }

.intro { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 32px; align-items: end; }
.intro .lede { color: var(--text-2); max-width: 62ch; margin-top: 8px; }
.eyebrow { font-size: 13px; letter-spacing: .12em; color: var(--text-3); font-weight: 500; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); display: inline-block; }
@media (max-width: 760px) { .intro { grid-template-columns: 1fr; } }

.map { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; overflow-x: auto; }
.lanes { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 0; min-width: 1040px; }
.lane { position: relative; padding: 0 14px; display: flex; flex-direction: column; gap: 8px; }
.lane + .lane { border-left: 1px dashed var(--border); }
.lane:not(:last-child)::after { content: ""; position: absolute; top: 14px; right: -9px; width: 16px; height: 16px; border-top: 2px solid var(--border-strong); border-right: 2px solid var(--border-strong); transform: rotate(45deg); background: var(--surface); z-index: 1; }
.lane-head { display: flex; flex-direction: column; gap: 2px; padding-bottom: 6px; margin-bottom: 2px; border-bottom: 3px solid var(--c); }
.lane-head b { font-size: 16px; color: var(--c); }
.lane-head small { color: var(--text-3); font-size: 12.5px; }
.node { display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 8px; align-items: start; text-align: left; padding: 8px 10px; border: 1px solid var(--border); background: var(--surface-2); border-radius: 8px; cursor: pointer; position: relative; transition: border-color .15s, background .15s, transform .15s; }
.node:hover { border-color: var(--c); transform: translateY(-1px); }
.node[aria-current="step"] { background: var(--c); border-color: var(--c); color: var(--on-brand); }
.node[aria-current="step"] .num { background: var(--on-brand); color: var(--c); }
.node[aria-current="step"] small { color: var(--on-brand); opacity: .9; }
.node .num { width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--c); color: var(--c); display: grid; place-items: center; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.node b { font-size: 14px; font-weight: 700; display: block; line-height: 1.35; }
.node small { font-size: 12px; color: var(--text-3); display: block; line-height: 1.4; margin-top: 2px; }
.node + .node::before { content: ""; position: absolute; left: 22px; top: -9px; height: 9px; border-left: 2px solid var(--border-strong); }
.map-note { margin-top: 12px; font-size: 13px; color: var(--text-3); }

.step { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 24px; align-items: start; scroll-margin-top: 16px; }
@media (max-width: 960px) { .step { grid-template-columns: 1fr; } }
.guide { display: flex; flex-direction: column; gap: 16px; }
.crumb { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 13px; color: var(--text-2); }
.crumb span { background: var(--muted-bg); padding: 2px 8px; border-radius: 999px; }
.crumb em { font-style: normal; color: var(--text-3); }
.stage-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--c); }
.stage-tag i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.why { color: var(--text-2); }
.howto { counter-reset: s; display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.howto li { counter-increment: s; display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 10px; }
.howto li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.howto b { color: var(--brand-deep); }
.tips { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; background: var(--warn-soft); border-radius: var(--r); border: 1px solid color-mix(in srgb, var(--warn) 25%, transparent); }
.tips h3 { color: var(--warn); font-size: 14px; }
.tips ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pager button { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; font-weight: 500; }
.pager button.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.pager button:disabled { opacity: .4; cursor: default; }
.count { font-size: 13px; color: var(--text-3); align-self: center; font-variant-numeric: tabular-nums; }

.screen { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
.bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--brand); color: var(--on-brand); font-size: 13px; }
.bar .dots { display: flex; gap: 5px; }
.bar .dots i { width: 9px; height: 9px; border-radius: 50%; background: color-mix(in srgb, var(--on-brand) 55%, transparent); }
.bar .addr { flex: 1; min-width: 0; background: color-mix(in srgb, var(--on-brand) 16%, transparent); padding: 2px 10px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .acct { white-space: nowrap; }
.app { display: grid; grid-template-columns: 132px minmax(0,1fr); min-height: 420px; }
.side { background: var(--surface-2); border-right: 1px solid var(--border); padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.side .logo { font-family: var(--font-head); font-weight: 700; color: var(--brand-deep); padding: 0 8px 10px; font-size: 15px; }
.side a { padding: 6px 8px; border-radius: 6px; color: var(--text-2); text-decoration: none; }
.side a.on { background: var(--brand-soft); color: var(--brand-deep); font-weight: 700; }
.main { padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
@media (max-width: 560px) { .app { grid-template-columns: 1fr; } .side { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--border); } .side .logo { width: 100%; padding-bottom: 4px; } }
.sub { display: grid; grid-template-columns: 128px minmax(0,1fr); gap: 12px; }
.sub nav { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; }
.sub nav b { font-size: 11.5px; color: var(--text-3); letter-spacing: .08em; margin-top: 6px; }
.sub nav span { padding: 4px 8px; border-radius: 6px; color: var(--text-2); }
.sub nav span.on { background: var(--brand); color: var(--on-brand); font-weight: 700; }
@media (max-width: 560px) { .sub { grid-template-columns: 1fr; } .sub nav { flex-direction: row; flex-wrap: wrap; } .sub nav b { width: 100%; } }
.ttl { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.ttl h4 { margin: 0; font-size: 17px; font-family: var(--font-head); }
.ttl small { color: var(--text-3); font-size: 12.5px; }
.lead { font-size: 13px; color: var(--text-2); }
.card { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 5px 12px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--surface); font-size: 12.5px; white-space: nowrap; }
.btn.p { background: var(--brand); border-color: var(--brand); color: var(--on-brand); font-weight: 700; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; padding: 1px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; border: 1px solid transparent; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
.pill.ai { background: var(--ai-soft); color: var(--ai); border-color: color-mix(in srgb, var(--ai) 30%, transparent); }
.pill.grey { background: var(--muted-bg); color: var(--text-2); }
.field { display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--text-2); min-width: 0; }
.input { border: 1px solid var(--border-strong); border-radius: 7px; padding: 5px 9px; background: var(--surface); color: var(--text); font-size: 13px; min-height: 30px; min-width: 0; overflow-wrap: anywhere; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
th { background: var(--muted-bg); color: var(--text-2); font-weight: 700; }
tr:last-child td { border-bottom: 0; }
.stat b { font-size: 22px; font-variant-numeric: tabular-nums; color: var(--brand-deep); line-height: 1.2; }
.stat span { font-size: 12px; color: var(--text-3); }
.steps-bar { display: flex; align-items: center; font-size: 12px; flex-wrap: wrap; row-gap: 6px; }
.steps-bar span { display: inline-flex; align-items: center; gap: 6px; color: var(--text-3); }
.steps-bar span i { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--border-strong); display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: 11px; }
.steps-bar span.done i, .steps-bar span.on i { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.steps-bar span.on { color: var(--text); font-weight: 700; }
.steps-bar hr { flex: 1; border: 0; border-top: 1.5px solid var(--border); margin: 0 8px; min-width: 14px; }
.note { border: 1px solid var(--border); border-left: 4px solid var(--c, var(--g1)); border-radius: 0 6px 6px 0; padding: 7px 9px; background: var(--surface); font-size: 12.5px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.note .h { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 11.5px; color: var(--text-3); }
.note .q { color: var(--text-3); font-size: 12px; }
.note .q b { color: var(--text-2); margin-right: 4px; }
.photo { aspect-ratio: 4/3; max-width: 100%; border-radius: 6px; background: linear-gradient(135deg, color-mix(in srgb, var(--g1) 30%, var(--surface)), color-mix(in srgb, var(--g3) 30%, var(--surface))); display: grid; place-items: center; color: var(--text-2); font-size: 12px; }
.chk { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; }
.chk i { flex: none; width: 15px; height: 15px; margin-top: 3px; border-radius: 4px; border: 1.5px solid var(--border-strong); display: grid; place-items: center; font-style: normal; font-size: 10px; }
.chk.on i { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.chk.lock i { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.chk.open i { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.wall td.n { text-align: center; }
.wall td.n b { display: inline-grid; place-items: center; min-width: 22px; height: 20px; border-radius: 5px; background: color-mix(in srgb, var(--s-live) 18%, var(--surface)); color: var(--s-live); }
.wall td.n.z { color: var(--text-3); }
.bars { display: flex; flex-direction: column; gap: 6px; }
.bars div { display: grid; grid-template-columns: 56px minmax(0,1fr) 44px; gap: 8px; align-items: center; font-size: 12px; }
.bars u { display: block; height: 10px; border-radius: 3px; background: var(--brand-sky); text-decoration: none; }
.bars em { font-style: normal; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); }
.chat { display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; }
.chat p { padding: 7px 10px; border-radius: 10px; max-width: 88%; }
.chat .me { align-self: flex-end; background: var(--brand); color: var(--on-brand); }
.chat .bot { align-self: flex-start; background: var(--muted-bg); }
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.group { border: 1.5px solid var(--c); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; background: color-mix(in srgb, var(--c) 6%, var(--surface)); }
.group .gh { display: flex; justify-content: space-between; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--c); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips span { font-size: 12px; padding: 2px 7px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border); }
.chips span.lead-s { border-color: var(--c); font-weight: 700; }
.qr { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 14px; align-items: start; }
@media (max-width: 520px) { .qr { grid-template-columns: 1fr; } }
.qr svg { width: 150px; height: 150px; background: #fff; padding: 8px; border-radius: 8px; border: 1px solid var(--border); }
.code6 { font-size: 26px; font-weight: 700; letter-spacing: .18em; font-variant-numeric: tabular-nums; color: var(--brand-deep); }
.slot { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; }
.slot .sh { display: flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 700; }
.slot .sh i { font-style: normal; width: 22px; height: 22px; border-radius: 6px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-size: 12px; }
.mono { font-variant-numeric: tabular-nums; }
.full { background: var(--full-bg); color: var(--full-fg); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.full .seatbig { font-size: 30px; font-weight: 700; }
.full p { font-size: 16px; }
.full small { font-size: 12px; opacity: .8; }
.mock-flag { font-size: 11.5px; color: var(--text-3); text-align: right; padding: 6px 12px; border-top: 1px solid var(--border); background: var(--surface-2); }
.timeline { display: flex; flex-direction: column; gap: 6px; }
.tl-row { display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 8px; align-items: center; font-size: 12px; }
.tl-track { position: relative; height: 16px; background: var(--muted-bg); border-radius: 4px; overflow: hidden; }
.tl-track u { position: absolute; top: 0; bottom: 0; text-decoration: none; opacity: .85; }
.split { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.2fr); gap: 10px; }
@media (max-width: 560px) { .split { grid-template-columns: 1fr; } }
.menu { min-width: 150px; padding: 6px 0; gap: 0; }
.menu span { padding: 4px 12px; font-size: 13px; }
.menu span.on { background: var(--brand-soft); font-weight: 700; }

.view-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.view-tabs button { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; font-size: 13px; }

  let s = 99; const r = () => { s = (s * 69069 + 1) >>> 0; return s / 2 ** 32; };

    const inF = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);

  return `<svg viewBox="0 0 ${n} ${n}" role="img" aria-label="示意 QR code，不能掃">${rects}${finder(0, 0)}${finder(n - 7, 0)}${finder(0, n - 7)}</svg>`;

const stageOf = k => STAGES.find(s => s.key === k);
const lanes = document.getElementById('lanes');
const stepEl = document.getElementById('step');
document.getElementById('legend').innerHTML = STAGES.map(s => `<span style="--c:${s.c}"><i></i>${s.name.slice(2)}</span>`).join('');
lanes.innerHTML = STAGES.map(st => `<div class="lane" style="--c:${st.c}">
  <div class="lane-head"><b>${st.name}</b><small>${st.hint}</small></div>
  ${STEPS.filter(x => x.stage === st.key).map(x => `<button type="button" class="node" data-id="${x.id}" style="--c:${st.c}"><span class="num">${STEPS.indexOf(x) + 1}</span><span><b>${x.title}</b><small>${x.short}</small></span></button>`).join('')}
</div>`).join('');


let view = 'shot';
const shotSrc = name => `shots/${name}.webp`;
function shotHtml(shots, k) {
  const [name, cap] = shots[k];
  return `<div class="shot">
    <figure><button type="button" class="zoom" data-k="${k}" aria-label="放大這張截圖"><img src="${shotSrc(name)}" alt="${cap}" loading="lazy" width="2720" height="1614"></button><figcaption>${cap}</figcaption></figure>
    ${shots.length > 1 ? `<div class="thumbs" role="group" aria-label="這一步的截圖">${shots.map(([n, c], j) => `<button type="button" data-k="${j}" aria-current="${j === k}" aria-label="第 ${j + 1} 張：${c}"><img src="${shotSrc(n)}" alt="" loading="lazy"></button>`).join('')}</div>` : ''}
    <p class="shot-note">點截圖可以放大看。截圖是平台的假資料版，資料都是假的。</p>
  </div>`;
}
function wireShots(shots) {
  const v = stepEl.querySelector('#viewer');
  if (!v || !shots.length) return;
  v.querySelectorAll('.thumbs button').forEach(b => b.onclick = () => { v.innerHTML = shotHtml(shots, +b.dataset.k); wireShots(shots); });
  const z = v.querySelector('.zoom');
  if (z) z.onclick = () => openLightbox(shots[+z.dataset.k]);
}
const lb = document.getElementById('lightbox');
let lbReturn = null;
function openLightbox([name, cap]) {
  lbReturn = document.activeElement;
  document.getElementById('lb-img').src = shotSrc(name);
  document.getElementById('lb-img').alt = cap;
  document.getElementById('lb-cap').textContent = cap;
  lb.hidden = false;
  document.getElementById('lb-close').focus();
}
function closeLightbox() { lb.hidden = true; if (lbReturn) lbReturn.focus(); }
document.getElementById('lb-close').onclick = closeLightbox;
lb.addEventListener('click', e => { if (e.target === lb || e.target.classList.contains('lb-img')) closeLightbox(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !lb.hidden) closeLightbox(); });

function show(id, scroll) {
  const i = Math.max(0, STEPS.findIndex(x => x.id === id));
  const x = STEPS[i]; const st = stageOf(x.stage);
  const shots = SHOTS[x.id] || [];
  if (!shots.length) view = 'mock';
  lanes.querySelectorAll('.node').forEach(n => { if (n.dataset.id === x.id) n.setAttribute('aria-current', 'step'); else n.removeAttribute('aria-current'); });
  stepEl.innerHTML = `<div class="guide">
      <span class="stage-tag" style="--c:${st.c}"><i></i>${st.name}</span>
      <h2>${i + 1}. ${x.title}</h2>
      <div class="crumb"><em>在哪裡：</em>${x.where.map(w => `<span>${w}</span>`).join('<em>›</em>')}</div>
      <p class="why">${x.why}</p>
      <h3>怎麼做</h3>
      <ol class="howto">${x.how.map(h => `<li><span>${h}</span></li>`).join('')}</ol>
      ${x.tips && x.tips.length ? `<div class="tips"><h3>小提醒</h3><ul>${x.tips.map(t => `<li>${t}</li>`).join('')}</ul></div>` : ''}
      <div class="pager">
        <button type="button" id="prev" ${i === 0 ? 'disabled' : ''}>← ${i ? STEPS[i - 1].title : '上一步'}</button>
        <span class="count">${i + 1}／${STEPS.length}</span>
        <button type="button" id="next" class="primary" ${i === STEPS.length - 1 ? 'disabled' : ''}>${i < STEPS.length - 1 ? STEPS[i + 1].title : '最後一步'} →</button>
      </div>
    </div>
    <div style="min-width:0">
      <div class="view-tabs" role="group" aria-label="看哪一種畫面"><button type="button" data-view="shot" aria-pressed="${view === 'shot'}">實際畫面截圖${shots.length > 1 ? `（${shots.length} 張）` : ''}</button><button type="button" data-view="mock" aria-pressed="${view === 'mock'}">示意圖</button></div>
      <div id="viewer">${view === 'shot' ? shotHtml(shots, 0) : x.screen()}</div>
    </div>`;
  stepEl.querySelectorAll('.view-tabs button').forEach(b => b.onclick = () => { view = b.dataset.view; show(x.id, false); });
  wireShots(shots);
  stepEl.querySelector('#prev').onclick = () => go(STEPS[i - 1] && STEPS[i - 1].id);
  stepEl.querySelector('#next').onclick = () => go(STEPS[i + 1] && STEPS[i + 1].id);
  if (scroll) {
    let reduce = false; try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    stepEl.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
  }
}
function go(id) { if (!id) return; if (location.hash !== '#' + id) location.hash = id; else show(id, true); }
lanes.addEventListener('click', e => { const b = e.target.closest('.node'); if (b) go(b.dataset.id); });
window.addEventListener('hashchange', () => show(location.hash.slice(1), true));
show(location.hash.slice(1) || STEPS[0].id, false);
</script>

</body></html>
